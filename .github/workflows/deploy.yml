name: Deploy to GitHub Pages

# Runs on the default branch and on the working branch, so the site can be
# previewed before merging. `workflow_dispatch` allows a manual re-deploy.
on:
  push:
    branches:
      - main
      - master
      - claude/garmin-dashboard-design-rcnghf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy — a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run rather than requiring someone to
          # flip it on in Settings first.
          enablement: true

      - name: Build
        # Project pages are served from /<repo>/, so assets need that prefix or
        # every script and stylesheet 404s against the user site root.
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"

      - name: Add SPA + Jekyll guards
        run: |
          # Pages runs Jekyll by default, which strips files and folders
          # beginning with an underscore.
          touch dist/.nojekyll
          # The app routes on the hash, so a 404 fallback is only belt and
          # braces for someone hitting a stale deep link.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
